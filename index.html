<title>Sprachen lernen – Griechisch · Norwegisch · Französisch</title>
<style>
.bnav button{min-width:0;padding-left:2px;padding-right:2px}
.vtools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.vtools button{padding:7px 11px;font-size:.88rem;border-radius:999px}
.vtools button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.vsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.vsum div{background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;box-shadow:var(--shadow)}
.vsum b{display:block;font-size:1.2rem}.vsum small{color:var(--muted);font-size:.75rem}
.vgh{font-weight:800;margin:14px 0 2px;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow .wt{flex:1;min-width:0}.vrow .wg{font-size:1.1rem}
.vlv{font-size:.72rem;color:var(--muted);white-space:nowrap}
.fc{perspective:1200px;margin:14px 0;cursor:pointer;user-select:none}
.fc .in{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .fa,.fc .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.fc .fb{transform:rotateY(180deg)}
.fc .big{font-size:2rem;font-weight:800;word-break:break-word}
.fc .hint{position:absolute;bottom:12px;font-size:.8rem;color:var(--muted)}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rate button{padding:12px 4px;font-weight:700}
.rate .r0{background:#fde2e1;border-color:#f5b5b2;color:#a12a22}.rate .r1{background:#fff3cd;border-color:#f0d58a;color:#7a5b00}.rate .r2{background:#d9f5e3;border-color:#9edbb4;color:#17683a}
@media (prefers-color-scheme:dark){.rate .r0{background:#4a2321;color:#ffb4ad}.rate .r1{background:#463a12;color:#ffe08a}.rate .r2{background:#173d27;color:#a6f0c0}}
:root{
  --bg:#f4f7fb;--card:#ffffff;--ink:#14213d;--muted:#5f6b85;--line:#dde4f0;
  --blue:#0d5eaf;--blue2:#1f7ae0;--soft:#e6f0fc;--good:#1b9e5a;--goodbg:#e4f7ec;--bad:#d64045;--badbg:#fdeaea;--gold:#f0a500;
  --shadow:0 2px 10px rgba(20,33,61,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1626;--card:#16213a;--ink:#e8eefc;--muted:#9aa8c7;--line:#27355a;--blue:#4c9bf0;--blue2:#6cb0ff;--soft:#1b2d52;--good:#43c985;--goodbg:#12362a;--bad:#ff7378;--badbg:#3a1c20;--gold:#f5b73a;--shadow:0 2px 10px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
#app{max-width:47.5rem;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--soft);color:var(--blue);font-weight:600}
button:hover{filter:brightness(.97)}
button.primary{background:var(--blue);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:.2px}
.brand span{color:var(--blue)}
.nav{display:flex;gap:6px}
.nav button{padding:8px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.4rem}
.stat small{color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue2);border-radius:99px;transition:width .3s}
.bar.gold i{background:var(--gold)}
.daily{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.daily h2{font-size:1.1rem}
.daily p{margin:2px 0 0;opacity:.9;font-size:.92rem}
.daily button{background:#fff;color:var(--blue);margin-left:auto;white-space:nowrap}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.unit h3{font-size:1.05rem;margin-bottom:2px}
.unit .ico{font-size:1.7rem;float:right}
.unit p{margin:2px 0 10px;color:var(--muted);font-size:.9rem}
.unit .row{display:flex;gap:8px;margin-top:10px}
.unit .row button{flex:1;padding:8px}
.meta{font-size:.82rem;color:var(--muted);margin-top:6px}
.list .item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list .gr{font-size:1.25rem;font-weight:700}
.list .tr{color:var(--blue);font-size:.9rem}
.list .de{color:var(--muted);font-size:.92rem}
.list .txt{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.b1,.dot.b2{background:var(--gold)}.dot.b3,.dot.b4,.dot.b5,.dot.b6{background:var(--good)}
.play{width:42px;height:42px;padding:0;border-radius:50%;flex:none;font-size:1.1rem}
.sesstop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sesstop .bar{flex:1}
.x{padding:6px 12px}
.q{text-align:center;padding:22px 16px}
.q .label{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
.q .big{font-size:2.3rem;font-weight:800;margin:10px 0 2px;word-break:break-word}
.q .trl{color:var(--blue);font-size:1.05rem}
.q .deu{font-size:1.6rem;font-weight:700;margin:10px 0}
.q .sub{color:var(--muted);margin-top:6px}
.audiorow{display:flex;gap:8px;justify-content:center;margin:12px 0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);padding:14px;font-weight:600;font-size:1.05rem}
.opt:hover{border-color:var(--blue2)}
.opt small{display:block;color:var(--blue);font-weight:500}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
input.txt{width:100%;font:inherit;font-size:1.3rem;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
input.txt:focus{outline:none;border-color:var(--blue2)}
.kbd{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px}
.kbd button{padding:8px 0;min-width:38px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:1.05rem;font-weight:600;border-radius:8px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.fb{border-radius:16px;padding:16px;margin-top:14px}
.fb.good{background:var(--goodbg);border:2px solid var(--good)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb h3{margin-bottom:6px}
.fb .ans{font-size:1.4rem;font-weight:800}
.fb .note{margin-top:6px;font-size:.92rem;color:var(--muted)}
.mic{width:86px;height:86px;border-radius:50%;font-size:2rem;padding:0;background:var(--blue);color:#fff}
.mic.rec{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,64,69,.5)}100%{box-shadow:0 0 0 22px rgba(214,64,69,0)}}
.heard{margin-top:10px;font-size:1.1rem}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:600}
.field small{display:block;color:var(--muted);font-weight:400}
select,input[type=number]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:220px}
input[type=range]{width:160px}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.chart div{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.chart i{display:block;background:var(--blue2);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:90vw;z-index:9;box-shadow:var(--shadow)}
.center{text-align:center}
.summary .big{font-size:3rem}
.warn{background:var(--badbg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:10px}

const MERK=t=>note('<b>Merke:</b> '+t);
function LES(o){
  o.ex=()=>{
    const I=shuffle(o.I);
    const mk=(x,fill)=>fill
      ?{t:'fill',lab:'Schreibe die fehlende Form',q:x[0],sub:x[2],a:x[1],alt:x[5]||[],expl:x[4]||o.ex0||''}
      :{t:'mc',lab:o.lab||'Welche Form passt?',q:x[0],sub:x[2],a:x[1],opts:shuffle([x[1]].concat(x[3])),expl:x[4]||o.ex0||''};
    const mc=I.slice(0,7).map(x=>mk(x,false));
    const fi=I.slice(7,11).map(x=>mk(x,true));
    const ar=smp(o.A,3).map(s=>({t:'arr',a:s[0],sub:s[1],alts:s[2]||[]}));
    const fx=smp(o.X,2).map(x=>({t:'mc',lab:'Welcher Satz ist richtig?',q:x[0],a:x[1],opts:shuffle([x[1]].concat(x[2])),expl:x[3],full:x[1],say:x[1]}));
    const ma=o.M?[{t:'match',pairs:smp(o.M,5)}]:[];
    return shuffle(mc.concat(fi,ar,fx,ma));
  };
  return o;
}

  {h:'Pronomen und Verbote',p:'<p>Beim Imperativ steht das kurze Pronomen <b>hinter</b> dem Verb: <b>Δώσε μου</b> το νερό. <b>Πάρε με</b> τηλέφωνο.</p><p>Verbote bildet man mit <b>μην</b> + Präsens- oder einmaliger Form (wie nach να) – nie mit dem Imperativ:</p>'+exs([['Έλα εδώ!','Komm her!'],['Ελάτε μέσα, παρακαλώ.','Kommen Sie bitte herein.'],['Στρίψτε δεξιά.','Biegen Sie rechts ab.'],['Συνεχίστε ευθεία.','Gehen Sie geradeaus weiter.'],['Περίμενε λίγο!','Warte kurz!'],['Δώσε μου το νερό.','Gib mir das Wasser.'],['Μην ανησυχείς!','Mach dir keine Sorgen!'],['Μην καπνίζετε εδώ.','Rauchen Sie hier nicht.'],['Μην αργήσεις!','Komm nicht zu spät!'],['Μην το ξεχάσεις!','Vergiss es nicht!']])},
  {h:'Typische Fehler',p:ERR([['Έρχεσαι εδώ!','Έλα εδώ!','έρχομαι hat einen besonderen Imperativ'],['Μου δώσε το νερό!','Δώσε μου το νερό!','Pronomen nach dem Imperativ'],['Δεν καπνίστε!','Μην καπνίζετε!','Verbot: μην + Präsens- oder einmalige Form, nie Imperativ'],['Πες μου … (zu einem Fremden)','Πείτε μου …','höflich: Plural-Form']])},
  {h:'Merkkasten',p:MERK('du-Form meist auf <b>-ε</b> (Περίμενε, Δώσε), ihr/Sie-Form auf <b>-ετε / -τε</b> (Περιμένετε, Δώστε). Zu Fremden immer die <b>Sie-Form</b>. Verbot: <b>Μην</b> + Präsens- oder einmalige Form (Μην καπνίζετε! Μην αργήσεις!), nie der Imperativ.')}
 ],

  {h:'Der Genitiv: „von wem?“',p:'<p>Der Besitzer steht im <b>Genitiv</b> hinter dem Nomen – mit Artikel:</p>'+tbl(['Nominativ','Genitiv','Beispiel'],[['ο Νίκος','<b>του</b> Νίκ<b>ου</b>','το αυτοκίνητο του Νίκου'],['ο πατέρας','του πατέρα','το σπίτι του πατέρα'],['ο Γιάννης','του Γιάννη','ο φίλος του Γιάννη'],['η Μαρία','<b>της</b> Μαρία<b>ς</b>','η τσάντα της Μαρίας'],['η Ελένη','της Ελένης','η μητέρα της Ελένης'],['το παιδί','του παιδιού','το όνομα του παιδιού'],['το σπίτι','του σπιτιού','η πόρτα του σπιτιού'],['το μάθημα','του μαθήματος','η αρχή του μαθήματος'],['τα παιδιά','<b>των</b> παιδιών','τα παιχνίδια των παιδιών']])+note('Faustregel: männlich -ος → -ου, -ας → -α, -ης → -η; weiblich + -ς; Plural immer <b>των … -ων</b>.')},
  {h:'Beispiele & typische Fehler',p:exs([['Το σπίτι μου είναι μικρό.','Mein Haus ist klein.'],['Πού είναι η τσάντα σου;','Wo ist deine Tasche?'],['Το όνομά μου είναι Τόμας.','Mein Name ist Thomas.'],['Το αυτοκίνητο του Νίκου.','Nikos’ Auto.'],['Η μητέρα της Μαρίας είναι δασκάλα.','Marias Mutter ist Lehrerin.'],['Το σπίτι των γονιών μου.','Das Haus meiner Eltern.']])+ERR([['το μου σπίτι','το σπίτι μου','μου steht hinter dem Nomen'],['το αυτοκίνητο Νίκος','το αυτοκίνητο του Νίκου','Besitzer im Genitiv mit Artikel'],['το όνομα μου','το όνομά μου','zweiter Akzent'],['η τσάντα του Μαρίας','η τσάντα της Μαρίας','weiblich → της']])},

 gram:{h:'Preteritum',p:'<p>Für „gestern“ benutzt man das <b>Preteritum</b> (einfache Vergangenheit) – wie das deutsche „ich ging“, aber im Alltag viel häufiger:</p>'+tbl(['Infinitiv','Preteritum','Deutsch'],[['å være','<b>var</b>','war'],['å ha','<b>hadde</b>','hatte'],['å gå','<b>gikk</b>','ging'],['å se','<b>så</b>','sah'],['å spise','<b>spiste</b>','aß'],['å kjøpe','<b>kjøpte</b>','kaufte'],['å jobbe','<b>jobbet</b>','arbeitete'],['å snakke','<b>snakket</b>','sprach']])+note('Regelmäßige Verben enden auf <b>-te</b> oder <b>-et</b>. Auch hier gilt: eine Form für alle Personen. Achtung, zwei Wörter: <b>så</b> = sah (von å se) und <b>så</b> = dann, so.')},
 sents:[['Jeg var hjemme i går.','Ich war gestern zu Hause.'],['Vi spiste middag med venner.','Wir aßen mit Freunden zu Abend.'],['Hun kjøpte en ny jakke.','Sie kaufte eine neue Jacke.']]});

LESSONS.push({id:'l25',blk:'b6',icon:'👕',title:'Farben & Kleidung',

 gram:{h:'Farben und die bestimmte Form',p:'<p>Farben sind Adjektive und bekommen die üblichen Endungen:</p>'+tbl(['en/ei-Wort','et-Wort','Plural'],[['en rød kjole','et rød<b>t</b> skjerf','rød<b>e</b> sko'],['en hvit genser','et hvit<b>t</b> skjørt','hvit<b>e</b> sokker'],['en blå jakke','et blå<b>tt</b> skjerf','blå jakker']])+'<p>Mit „der/die/das“ steht im Norwegischen <b>doppelt</b> bestimmt: ein Artikelwort vorn <b>und</b> die Endung hinten. Das Adjektiv endet dann immer auf <b>-e</b>:</p>'+tbl(['','Norwegisch','Deutsch'],[['en-Wort','<b>den</b> svart<b>e</b> kjole<b>n</b>','das schwarze Kleid'],['et-Wort','<b>det</b> rød<b>e</b> skjerf<b>et</b>','der rote Schal'],['Plural','<b>de</b> rød<b>e</b> sko<b>ene</b>','die roten Schuhe']])+note('<b>blå</b>, <b>grå</b>, <b>rosa</b> und <b>oransje</b> bekommen kein -e. <b>å ha på seg</b> heißt „anhaben / anziehen“: Jeg har på meg en jakke.')},
 sents:[['Jakken min er blå.','Meine Jacke ist blau.'],['Hun har på seg en rød kjole.','Sie trägt ein rotes Kleid.'],['Jeg liker den grønne genseren.','Ich mag den grünen Pullover.']]});

LESSONS.push({id:'l26',blk:'b6',icon:'🩺',title:'Körper & Gesundheit',

LESSONS.push({id:'l28',blk:'b6',icon:'🧹',title:'Haushalt & Alltagsverben',
 goal:'Du beschreibst, was du zu Hause machst, auch mit reflexiven Verben.',
 words:[['å lage mat','kochen'],['å vaske','waschen / putzen'],['å rydde','aufräumen'],['å handle','einkaufen'],['å sove','schlafen'],['å våkne','aufwachen'],['å vaske seg','sich waschen'],['å dusje','duschen'],['å kle på seg','sich anziehen'],['å legge seg','ins Bett gehen'],['å sette seg','sich setzen'],['å glede seg til','sich freuen auf'],['å hvile seg','sich ausruhen'],['å åpne','öffnen'],['å lukke','schließen'],['å bruke','benutzen'],['å vente','warten'],['å begynne','anfangen'],['å slutte','aufhören'],['å gjøre','machen / tun'],['å ta','nehmen'],['å gi','geben'],['å tenke','denken'],['å huske','sich erinnern'],['å glemme','vergessen']],
 dlg:{t:'Am Wochenende',l:[['Ingrid','Hva gjør du i helgen?','Was machst du am Wochenende?'],['Jonas','På lørdag må jeg rydde og vaske.','Am Samstag muss ich aufräumen und putzen.'],['Ingrid','Kjedelig! Og på søndag?','Langweilig! Und am Sonntag?'],['Jonas','Da hviler jeg meg. Jeg sover lenge.','Da ruhe ich mich aus. Ich schlafe lange.'],['Ingrid','Jeg gleder meg også til søndag!','Ich freue mich auch auf Sonntag!']]},
 gram:{h:'Reflexive Verben',p:'<p>Manche Verben brauchen ein Reflexivpronomen – wie im Deutschen „sich“:</p>'+tbl(['Person','å vaske seg','Deutsch'],[['jeg','vasker <b>meg</b>','ich wasche mich'],['du','vasker <b>deg</b>','du wäschst dich'],['han / hun','vasker <b>seg</b>','er / sie wäscht sich'],['vi','vasker <b>oss</b>','wir waschen uns'],['dere','vasker <b>dere</b>','ihr wascht euch'],['de','vasker <b>seg</b>','sie waschen sich']])+note('Nicht immer gleich wie im Deutschen: <b>å legge seg</b> = ins Bett gehen, <b>å glede seg til</b> = sich freuen auf. Steht die Zeit vorn, rückt das Subjekt hinter das Verb: Da hviler <b>jeg</b> meg.')},
 sents:[['Jeg står opp og dusjer.','Ich stehe auf und dusche.'],['Vi gleder oss til ferien.','Wir freuen uns auf die Ferien.'],['Hun legger seg klokka elleve.','Sie geht um elf ins Bett.']]});

LESSONS.push({id:'l29',blk:'b6',icon:'🛍️',title:'Kleidung kaufen',

LESSONS.push({id:'l31',blk:'b7',icon:'📆',title:'Termine & Verabredungen',

 dlg:{t:'Eine Einladung',l:[['Nora','Hei! Jeg har bursdag på lørdag. Vil du komme på fest?','Hallo! Ich habe am Samstag Geburtstag. Willst du zur Feier kommen?'],['Thomas','Gratulerer! Ja, gjerne. Når begynner festen?','Glückwunsch! Ja, gern. Wann fängt die Feier an?'],['Nora','Klokka sju. Ingrid kommer også.','Um sieben. Ingrid kommt auch.'],['Thomas','Fint. Skal jeg ta med noe?','Schön. Soll ich etwas mitbringen?'],['Nora','Nei, bare kom! Jeg gleder meg.','Nein, komm einfach! Ich freue mich.'],['Thomas','Takk for invitasjonen. Vi ses!','Danke für die Einladung. Bis dann!']]},

LESSONS.push({id:'l32',blk:'b7',icon:'💼',title:'Arbeit & Schule',
 goal:'Du sprichst über Beruf, Kollegen, Schule und Kurse.',
 words:[['en jobb','ein Job'],['en arbeidsplass','ein Arbeitsplatz'],['en sjef','ein Chef'],['en kollega','ein Kollege'],['et møte','eine Besprechung'],['en datamaskin','ein Computer'],['en klasse','eine Klasse'],['en elev','ein Schüler'],['et universitet','eine Universität'],['et fag','ein Schulfach'],['en lekse','eine Hausaufgabe'],['en eksamen','eine Prüfung'],['å lære','lernen / beibringen'],['å undervise','unterrichten'],['å skrive','schreiben'],['å regne','rechnen'],['å ringe','anrufen'],['en e-post','eine E-Mail'],['arbeidsledig','arbeitslos'],['en lønn','ein Gehalt'],['heltid','Vollzeit'],['deltid','Teilzeit'],['en pause','eine Pause'],['et kurs','ein Kurs'],['ferdig','fertig'],['Jeg har det travelt','Ich habe viel zu tun']],
 dlg:{t:'Wie läuft die Arbeit?',l:[['Ingrid','Hvordan går det på jobben?','Wie läuft es bei der Arbeit?'],['Thomas','Bra, men jeg har det travelt. Vi har mange møter.','Gut, aber ich habe viel zu tun. Wir haben viele Besprechungen.'],['Ingrid','Liker du kollegene dine?','Magst du deine Kollegen?'],['Thomas','Ja, de er hyggelige. Sjefen min er også grei.','Ja, sie sind nett. Mein Chef ist auch in Ordnung.'],['Ingrid','Jobber du heltid?','Arbeitest du Vollzeit?'],['Thomas','Nei, deltid. Jeg tar også et norskkurs.','Nein, Teilzeit. Ich mache auch einen Norwegischkurs.']]},

var REF;
(function(){
const noHint=s=>s.replace(/\s*\([^)]*\)/g,'');
const GL=o=>{
  const errTbl=tbl(['✗ Falsch','✓ Richtig','Warum?'],o.err.slice(0,4).map(e=>['<s>'+esc(e[2][0])+'</s>','<b>'+esc(e[1])+'</b>',esc(e[3])]));

  const ex=()=>{
    const b=shuffle(o.base);
    const mc=b.slice(0,7).map(x=>({t:'mc',lab:mcLab,q:x[0],sub:x[3],opts:shuffle([x[1]].concat(x[2])),a:x[1],expl:x[4]||o.rule,full:noHint(x[0]).replace('___',x[1])}));

    const ar=smp(o.arr,3).map(x=>Object.assign({t:'arr',a:x[0],sub:x[1]},x[2]?{alts:x[2]}:{}));
    const er=smp(o.err,3).map(e=>({t:'mc',lab:'Welcher Satz ist richtig?',q:e[0],opts:shuffle([e[1]].concat(e[2])),a:e[1],expl:e[3],full:e[1],say:e[1]}));
    const ma=[{t:'match',pairs:o.match[Math.floor(Math.random()*o.match.length)]}];
    return shuffle(mc.concat(fi,ar,er,ma));
  };
  return {id:o.id,icon:o.icon,title:o.title,desc:o.desc,after:o.after,learn:learn,ex:ex,_o:o};
};

 gram:{h:'être – sein',p:conjTbl('etre')+note('Nationalität ist ein Adjektiv und wird klein geschrieben; Frauen hängen ein <b>-e</b> an: Je suis allemand / allemand<b>e</b>, français / français<b>e</b>. Bei „aus“ fällt der Artikel weg: Je viens <b>de</b> France, <b>d’</b>Allemagne, <b>de</b> Suisse.')},

LESSONS.push({id:'l06',blk:'b1',icon:'👥',title:'Ich, du, wir',

  P('à und de verschmelzen',tblRows(['','à + …','de + …'],[['le','<b>au</b>','<b>du</b>'],['la','à la','de la'],['l’','à l’','de l’'],['les','<b>aux</b>','<b>des</b>']])+exs([['Je vais au supermarché.','Ich gehe zum Supermarkt.'],['Elle va à la boulangerie.','Sie geht zur Bäckerei.'],['Ils vont à l’hôtel.','Sie gehen ins Hotel.'],['Je parle aux enfants.','Ich spreche mit den Kindern.'],['à côté du parc','neben dem Park'],['C’est la voiture du voisin.','Das ist das Auto des Nachbarn.']])),
  P('Drei Ausnahmen',tblRows(['Situation','Artikel','Beispiel'],[['nach Verneinung','<b>de</b>','Je ne bois pas <b>de</b> café.'],['nach Mengen','<b>de</b>','beaucoup <b>de</b> pain, un kilo <b>de</b> pommes'],['nach aimer, adorer, détester','<b>le / la / les</b>','J’aime <b>le</b> fromage.']])+fehler([['Je vais à le cinéma.','Je vais au cinéma.','à + le = au.'],['Je ne bois pas du café.','Je ne bois pas de café.','Nach Verneinung nur de.'],['J’aime du fromage.','J’aime le fromage.','Vorlieben: bestimmter Artikel.'],['Il mange pain.','Il mange du pain.','Ohne Artikel geht es nicht.']])),
  P('Merkkasten',merk('Unbestimmte Menge: <b>du / de la / de l’ / des</b>. Verneinung und Mengenangaben: nur <b>de</b>. à + le = <b>au</b>, à + les = <b>aux</b>, de + le = <b>du</b>, de + les = <b>des</b>.'))
 ],ex:exStd('g8')},
{id:'g12',icon:'👉',title:'Der Imperativ',desc:'Aufforderungen mit tu, nous und vous',after:'l16',
 learn:[
  P('Bildung',tblRows(['Infinitiv','tu','nous','vous'],[['parler','<b>parle</b>','parlons','parlez'],['finir','finis','finissons','finissez'],['prendre','prends','prenons','prenez'],['aller','<b>va</b>','allons','allez'],['faire','fais','faisons','faites']])+'<p>Man nimmt die Präsensform <b>ohne Pronomen</b>. Bei Verben auf <b>-er</b> (und bei aller) fällt in der tu-Form das <b>-s</b> weg: tu parles → <b>Parle !</b></p><p>Die nous-Form bedeutet „Lass(t) uns …“: <b>Allons-y !</b> (Los geht’s!)</p>'),
  P('Unregelmäßig & verneint',tblRows(['','tu','nous','vous'],[['être','sois','soyons','soyez'],['avoir','aie','ayons','ayez']])+exs([['Écoute !','Hör zu!'],['Venez ici !','Kommen Sie her!'],['Prenez la deuxième rue à gauche.','Nehmen Sie die zweite Straße links.'],['Sois sage !','Sei brav!'],['N’aie pas peur !','Hab keine Angst!'],['Ne parlez pas si vite !','Sprechen Sie nicht so schnell!']])+note('Verneint umklammert ne … pas das Verb: <b>Ne</b> fume <b>pas</b> ! Bei Reflexivverben hängt das Pronomen hinten an: <b>Lève-toi !</b> (Steh auf!) – verneint: <b>Ne te lève pas !</b>')),
  P('Typische Fehler',fehler([['Écoutes !','Écoute !','-er-Verben: kein -s in der tu-Form.'],['Vas au lit !','Va au lit !','aller: va.'],['Es sage !','Sois sage !','être hat eigene Formen.'],['Parlez ne pas !','Ne parlez pas !','ne … pas umklammert das Verb.']])),
  P('Merkkasten',merk('Imperativ = Präsens ohne Pronomen. tu-Form der -er-Verben ohne -s (Parle !, Va !). Unregelmäßig: <b>sois / soyez</b>, <b>aie / ayez</b>. Höflich wird es mit „s’il vous plaît“.'))
 ],ex:exStd('g12')},
{id:'g11',icon:'🌍',title:'Präpositionen bei Orten',desc:'à Paris, en France, au Canada, aux États-Unis',after:'l17',
 learn:[
  P('In / nach',tblRows(['Ort','Präposition','Beispiel'],[['Stadt','<b>à</b>','à Paris, à Berlin'],['weibliches Land (meist auf -e)','<b>en</b>','en France, en Allemagne, en Suisse'],['männliches Land mit Vokal','<b>en</b>','en Iran, en Irak'],['männliches Land','<b>au</b>','au Canada, au Japon, au Portugal'],['Land im Plural','<b>aux</b>','aux États-Unis, aux Pays-Bas']])+'<p>„in“ und „nach“ sind dasselbe Wort: J’habite <b>en</b> France. Je vais <b>en</b> France.</p>'),
  P('Aus / von',tblRows(['Ort','Präposition','Beispiel'],[['Stadt','<b>de / d’</b>','de Paris, d’Amsterdam'],['weibliches Land','<b>de / d’</b>','de France, d’Allemagne'],['männliches Land mit Vokal','<b>d’</b>','d’Iran'],['männliches Land','<b>du</b>','du Canada, du Japon'],['Plural','<b>des</b>','des États-Unis']])+exs([['Je viens d’Allemagne.','Ich komme aus Deutschland.'],['Il habite au Maroc.','Er wohnt in Marokko.'],['Nous partons en Espagne.','Wir fahren nach Spanien.'],['Elle travaille aux États-Unis.','Sie arbeitet in den USA.'],['Tu viens du Canada ?','Kommst du aus Kanada?'],['Je suis né à Hambourg.','Ich bin in Hamburg geboren.']])+note('Ausnahme: <b>le Mexique</b> und <b>le Cambodge</b> enden auf -e, sind aber männlich: au Mexique.')),
  P('Typische Fehler',fehler([['J’habite à France.','J’habite en France.','Länder brauchen en / au / aux.'],['Je vais en Canada.','Je vais au Canada.','le Canada ist männlich.'],['Nous sommes en Berlin.','Nous sommes à Berlin.','Städte: à.'],['Il vient du Allemagne.','Il vient d’Allemagne.','Weibliches Land: de / d’.']])),
  P('Merkkasten',merk('Stadt: <b>à</b> / <b>de</b>. Weibliches Land oder Land mit Vokal am Anfang: <b>en</b> / <b>de, d’</b>. Männliches Land: <b>au</b> / <b>du</b>. Plural: <b>aux</b> / <b>des</b>. Lerne Ländernamen mit Artikel: la France, le Canada, les États-Unis.'))
 ],ex:exStd('g11')},
{id:'g13',icon:'👆',title:'il y a, c’est, il est',desc:'„es gibt“, „das ist“ und „er ist“ richtig unterscheiden',after:'l19',
 learn:[
  P('Drei Ausdrücke',tblRows(['Ausdruck','Bedeutung','Beispiel'],[['<b>il y a</b>','es gibt / da ist','Il y a un café ici.'],['<b>c’est / ce sont</b>','das ist / das sind','C’est mon frère. Ce sont mes parents.'],['<b>il est / elle est</b>','er / sie ist','Il est médecin. Elle est gentille.']])),
  P('c’est oder il est?',tblRows(['danach folgt …','Form','Beispiel'],[['Artikel, Possessiv, Name','<b>c’est</b>','C’est un médecin. C’est Paul.'],['betontes Pronomen','<b>c’est</b>','C’est moi.'],['Beruf / Nationalität ohne Artikel','<b>il / elle est</b>','Il est médecin. Elle est française.'],['Adjektiv zu einer Person','<b>il / elle est</b>','Elle est très gentille.'],['allgemeines Urteil','<b>c’est</b> + männl. Adjektiv','C’est beau ! C’est facile.']])+exs([['Il y a trois chambres.','Es gibt drei Zimmer.'],['Est-ce qu’il y a une pharmacie ici ?','Gibt es hier eine Apotheke?'],['C’est un bon professeur.','Das ist ein guter Lehrer.'],['Il est professeur.','Er ist Lehrer.'],['Paris ? C’est magnifique !','Paris? Das ist wunderbar!'],['Ce sont mes amis.','Das sind meine Freunde.']])),
  P('Typische Fehler',fehler([['Il est un médecin.','Il est médecin. / C’est un médecin.','Nach il est steht der Beruf ohne Artikel.'],['C’est belle !','C’est beau !','Nach c’est (allgemein) die männliche Form.'],['Il a un café ici ?','Il y a un café ici ?','„es gibt“ braucht das y.']])),
  P('Merkkasten',merk('<b>il y a</b> = es gibt. <b>c’est</b> + Artikel / Name / Pronomen. <b>il / elle est</b> + Adjektiv oder Beruf ohne Artikel. Allgemeines Urteil: <b>C’est bon !</b>'))
 ],ex:exStd('g13')},
{id:'g5',icon:'👪',title:'Mein, dein, sein',desc:'Possessivbegleiter – sie richten sich nach dem Nomen',after:'l20',

  P('Die Formen',tblRows(['','männlich','weiblich','Plural'],[['mein','mon','ma','mes'],['dein','ton','ta','tes'],['sein / ihr','son','sa','ses'],['unser','notre','notre','nos'],['euer / Ihr','votre','votre','vos'],['ihr (mehrere Besitzer)','leur','leur','leurs']])),
  P('Nach dem Nomen, nicht nach dem Besitzer','<p>Das Possessiv richtet sich nach dem <b>Nomen</b> – nicht nach dem Besitzer:</p>'+exs([['sa mère','seine Mutter / ihre Mutter'],['son père','sein Vater / ihr Vater'],['ses enfants','seine / ihre Kinder'],['mon amie','meine Freundin (Vokal → mon)'],['ton école','deine Schule (Vokal → ton)'],['leur maison','ihr Haus (von mehreren)'],['leurs enfants','ihre Kinder (von mehreren)']])+note('Vor Vokal oder stummem h steht immer <b>mon, ton, son</b> – auch bei weiblichen Nomen: mon amie, son histoire.')),
  P('Typische Fehler',fehler([['ma amie','mon amie','Vor Vokal: mon.'],['son mère','sa mère','mère ist weiblich – egal, wem sie gehört.'],['sa père (von ihr)','son père','père ist männlich → son, auch wenn „ihr“ gemeint ist.'],['leurs maison','leur maison','Ein Haus → leur (Singular).']])),
  P('Merkkasten',merk('mon / ma / mes · ton / ta / tes · son / sa / ses · notre / nos · votre / vos · leur / leurs. Entscheidend ist das <b>Geschlecht des Nomens</b>. Vor Vokal immer mon, ton, son.'))
 ],ex:exStd('g5')},
{id:'g14',icon:'🛠️',title:'Verben auf -ir und -re',desc:'finir, partir, attendre – drei weitere Muster',after:'l21',

  P('-ir mit -iss- (finir)',conjTbl('finir')+'<p>So gehen auch <b>choisir</b> (wählen), <b>réussir</b> (gelingen), <b>grandir</b> (wachsen): nous choisissons, ils réussissent.</p>'),
  P('-ir ohne -iss- (partir) und -re (attendre)',conjTbl('partir')+conjTbl('attendre')+'<p>Wie partir: <b>sortir</b> (ausgehen), <b>dormir</b> (schlafen: je dors, nous dormons). Wie attendre: <b>vendre</b> (verkaufen), <b>répondre</b> (antworten), <b>entendre</b> (hören).</p>'+note('Bei -re-Verben hat die il-Form <b>keine Endung</b>: il attend, il vend, il répond.')),

  P('Typische Fehler & Merkkasten',fehler([['nous finons','nous finissons','finir-Gruppe: -iss- im Plural.'],['ils sortissent','ils sortent','partir / sortir / dormir haben kein -iss-.'],['il attendt','il attend','-re: il-Form ohne Endung.'],['J’attends pour le bus.','J’attends le bus.','attendre + direktes Objekt.']])+merk('finir: -is, -is, -it, -issons, -issez, -issent. partir: pars, pars, part, partons, partez, partent. attendre: -s, -s, –, -ons, -ez, -ent.'))
 ],ex:exStd('g14')},
{id:'g15',icon:'🪞',title:'Reflexivverben',desc:'se lever, s’appeler, se reposer – mit me, te, se …',after:'l22',
 learn:[
  P('Die Formen',conjTbl('sereveiller')+tblRows(['Person','Pronomen','vor Vokal'],[['je','me','m’'],['tu','te','t’'],['il / elle','se','s’'],['nous','nous','nous'],['vous','vous','vous'],['ils / elles','se','s’']])),
  P('Häufige Reflexivverben',tblRows(['Verb','Deutsch','Beispiel'],[['s’appeler','heißen','Je m’appelle Anna.'],['se lever','aufstehen','Je me lève à sept heures.'],['se coucher','ins Bett gehen','Tu te couches tard.'],['s’habiller','sich anziehen','Il s’habille.'],['se doucher','duschen','Nous nous douchons.'],['se reposer','sich ausruhen','Vous vous reposez.'],['se promener','spazieren gehen','Ils se promènent.']])+note('Manche Verben sind nur im Französischen reflexiv: se lever (aufstehen), se promener (spazieren gehen), se réveiller (aufwachen).')),
  P('Verneinung, Infinitiv, Vergangenheit',exs([['Je m’appelle Thomas.','Ich heiße Thomas.'],['Je ne me lève pas.','Ich stehe nicht auf.'],['Je vais me coucher.','Ich werde ins Bett gehen.'],['Tu vas te reposer ?','Wirst du dich ausruhen?'],['Je me suis levé à six heures.','Ich bin um sechs aufgestanden.'],['Elle s’est habillée.','Sie hat sich angezogen.']])+note('Im passé composé stehen Reflexivverben immer mit <b>être</b>. Beim Infinitiv passt das Pronomen zur Person: je vais <b>me</b> coucher, tu vas <b>te</b> coucher.')),
  P('Typische Fehler & Merkkasten',fehler([['Je me ne lève pas.','Je ne me lève pas.','ne steht vor dem Pronomen.'],['Il se appelle Paul.','Il s’appelle Paul.','Vor Vokal: s’.'],['Nous se reposons.','Nous nous reposons.','Pronomen passt zur Person.'],['Je vais se coucher.','Je vais me coucher.','Auch beim Infinitiv: me / te / se …']])+merk('Pronomen vor das Verb: me, te, se, nous, vous, se (vor Vokal m’, t’, s’). Verneinung: <b>ne</b> + Pronomen + Verb + <b>pas</b>. passé composé mit <b>être</b>.'))
 ],ex:exStd('g15')},
{id:'g9',icon:'⏮️',title:'Vergangenheit (passé composé)',desc:'avoir oder être + Partizip',after:'l24',
 learn:[
  P('Mit avoir',tblRows(['Infinitiv','Partizip','Beispiel'],[['manger','mang<b>é</b>','J’ai mangé.'],['finir','fin<b>i</b>','Tu as fini.'],['attendre','attend<b>u</b>','Il a attendu.'],['faire','<b>fait</b>','Nous avons fait.'],['voir','<b>vu</b>','Vous avez vu.'],['prendre','<b>pris</b>','Ils ont pris.'],['boire','<b>bu</b>','J’ai bu.'],['lire','<b>lu</b>','J’ai lu.'],['écrire','<b>écrit</b>','J’ai écrit.'],['avoir / être','<b>eu / été</b>','J’ai eu / j’ai été.']])+'<p>Regel: -er → <b>-é</b>, -ir → <b>-i</b>, -re → <b>-u</b>. Die meisten Verben bilden das passé composé mit <b>avoir</b>.</p>'),
  P('Mit être',tblRows(['Infinitiv','Beispiel'],[['aller','Je suis allé(e).'],['venir','Elle est venu<b>e</b>.'],['arriver','Ils sont arrivé<b>s</b>.'],['partir','Tu es parti(e) ?'],['rester','Nous sommes resté(e)s.'],['entrer / sortir','Elle est sortie.'],['naître / mourir','Il est né en 1990.']])+note('Mit <b>être</b> wird das Partizip angeglichen: weiblich <b>+e</b>, Plural <b>+s</b>. Dazu kommen alle Reflexivverben: je <b>me suis</b> levé.')),
  P('Beispiele & Verneinung',exs([['Hier, j’ai travaillé.','Gestern habe ich gearbeitet.'],['Nous avons visité le musée.','Wir haben das Museum besichtigt.'],['Elle est allée au cinéma.','Sie ist ins Kino gegangen.'],['Ils sont arrivés hier soir.','Sie sind gestern Abend angekommen.'],['Je n’ai pas compris.','Ich habe nicht verstanden.'],['Tu n’es pas venu.','Du bist nicht gekommen.']])+note('Die Verneinung umklammert das Hilfsverb: Je <b>n’</b>ai <b>pas</b> mangé.')),
  P('Typische Fehler & Merkkasten',fehler([['J’ai allé au cinéma.','Je suis allé au cinéma.','aller geht mit être.'],['Elle est venu.','Elle est venue.','Mit être: Angleichung.'],['J’ai buvé.','J’ai bu.','boire → bu.'],['Je n’ai compris pas.','Je n’ai pas compris.','ne … pas um avoir.']])+merk('passé composé = <b>avoir / être</b> im Präsens + Partizip. Mit être: Bewegung / Zustandswechsel (aller, venir, arriver, partir, rester …) und Reflexivverben – dann Angleichung.'))
 ],ex:exStd('g9')},
{id:'g17',icon:'🎯',title:'Objektpronomen',desc:'le, la, les, lui, leur – und wo sie stehen',after:'l29',
 learn:[
  P('Direkt und indirekt',tblRows(['','direkt (wen?)','indirekt (wem? / à …)'],[['mich','me (m’)','me (m’)'],['dich','te (t’)','te (t’)'],['ihn / es','<b>le</b> (l’)','<b>lui</b>'],['sie (Sg.)','<b>la</b> (l’)','<b>lui</b>'],['uns','nous','nous'],['euch / Sie','vous','vous'],['sie (Pl.)','<b>les</b>','<b>leur</b>']])+'<p>Ob direkt oder indirekt, entscheidet das <b>französische</b> Verb: voir <b>quelqu’un</b> (direkt), parler <b>à</b> quelqu’un (indirekt).</p>'),
  P('Die Stellung',tblRows(['Fall','Beispiel'],[['Präsens: vor dem Verb','Je <b>le</b> vois.'],['Verneinung','Je ne <b>le</b> vois pas.'],['mit Infinitiv: vor dem Infinitiv','Je vais <b>le</b> voir.'],['passé composé: vor dem Hilfsverb','Je <b>l’</b>ai vu.'],['Imperativ bejaht: hinten','Regarde-<b>le</b> !']])+exs([['Tu vois Paul ? – Oui, je le vois.','Siehst du Paul? – Ja, ich sehe ihn.'],['Tu aimes la musique ? – Oui, je l’aime.','Magst du Musik? – Ja, ich mag sie.'],['Je parle à Marie. → Je lui parle.','Ich spreche mit ihr.'],['Je téléphone à mes parents. → Je leur téléphone.','Ich rufe sie an.'],['Je vais acheter ce pull. → Je vais l’acheter.','Ich werde ihn kaufen.'],['Il m’aide beaucoup.','Er hilft mir sehr.']])),
  P('Typische Fehler',fehler([['Je vois le.','Je le vois.','Pronomen vor dem Verb.'],['Je les téléphone.','Je leur téléphone.','téléphoner à → indirekt.'],['Je la ne connais pas.','Je ne la connais pas.','ne vor dem Pronomen.'],['Je le vais acheter.','Je vais l’acheter.','Vor dem Infinitiv.']])+note('Verben, die anders als im Deutschen <b>indirekt</b> sind: téléphoner <b>à</b>, répondre <b>à</b>, demander <b>à</b>. Direkt (anders als im Deutschen): aider <b>quelqu’un</b> (jemandem helfen), attendre <b>quelqu’un</b> (auf jemanden warten).')),
  P('Merkkasten',merk('direkt: le, la, l’, les · indirekt: lui, leur · beide: me, te, nous, vous. Stellung: <b>vor</b> dem konjugierten Verb bzw. vor dem Infinitiv; im bejahten Imperativ dahinter.'))
 ],ex:exStd('g17')},
{id:'g19',icon:'🚫',title:'Verneinung: nie, nichts, niemand',desc:'ne … jamais, plus, rien, personne, pas encore',after:'l31',
 learn:[
  P('Die Verneinungswörter',tblRows(['Französisch','Deutsch','Beispiel'],[['ne … pas','nicht','Je ne fume pas.'],['ne … jamais','nie','Je ne fume jamais.'],['ne … plus','nicht mehr','Je ne fume plus.'],['ne … rien','nichts','Je ne vois rien.'],['ne … personne','niemand(en)','Je ne vois personne.'],['ne … pas encore','noch nicht','Je n’ai pas encore mangé.']])+'<p>jamais, plus, rien und personne ersetzen <b>pas</b> – sie stehen nie zusammen mit pas.</p>'),
  P('Besondere Stellungen',exs([['Personne ne vient.','Niemand kommt.'],['Rien n’est simple.','Nichts ist einfach.'],['Je n’ai rien mangé.','Ich habe nichts gegessen.'],['Je n’ai vu personne.','Ich habe niemanden gesehen.'],['Il ne pleut plus.','Es regnet nicht mehr.'],['Je ne mange jamais de viande.','Ich esse nie Fleisch.']])+note('Als Subjekt stehen <b>personne</b> und <b>rien</b> am Satzanfang – mit ne, ohne pas. Im passé composé steht <b>rien</b> vor dem Partizip, <b>personne</b> dahinter.')),
  P('Typische Fehler',fehler([['Je ne mange pas jamais.','Je ne mange jamais.','jamais ersetzt pas.'],['Personne n’est pas venu.','Personne n’est venu.','Kein pas nach personne.'],['Je n’ai acheté rien.','Je n’ai rien acheté.','rien vor dem Partizip.'],['Je n’ai personne vu.','Je n’ai vu personne.','personne nach dem Partizip.']])),
  P('Merkkasten',merk('<b>ne</b> + Verb + jamais / plus / rien / personne / pas encore. Nie doppelt mit pas. Wie bei pas gilt: danach <b>de</b> statt un / du (Je ne bois plus de café).'))
 ],ex:exStd('g19')},
{id:'g18',icon:'📈',title:'Vergleichen & Steigern',desc:'plus / moins / aussi … que, meilleur, mieux',after:'l33',
 learn:[

const clean=s=>s.toLowerCase().normalize('NFC').replace(/ς/g,'σ').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
const strip=s=>{let x=String(s).toLowerCase().normalize('NFC');const keep=[...(LANG.keep||'')];
  if(keep.length)x=x.replace(/./gu,c=>{const k=keep.indexOf(c);return k>=0?String.fromCodePoint(0xE000+k):c});
  x=x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').normalize('NFC');
  if(keep.length)x=x.replace(/[\uE000-\uE0FF]/gu,c=>keep[c.codePointAt(0)-0xE000]);
  return x.replace(/ς/g,'σ').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim()};
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function checkTyped(inp,it){
  const g=target(it),a=strip(inp);
  if(!a)return{ok:false,empty:true};
  const hasArt=!UBY[it.unit].alpha&&LANG.ART.test(g+' ');
  const cands=[g];if(hasArt)cands.push(LANG.artless(g));
  for(const c of cands){if(strip(c)===a){return{ok:true,note:clean(c)===clean(inp)?'':'Achte auf die Akzente: '+g}}}
  const tc=it.tr?[it.tr]:[];if(hasArt&&it.tr)tc.push(it.tr.split(/\s+/).slice(1).join(' '));
  for(const c of tc){const t=strip(c);if(lev(a,t)<=Math.floor(t.length/6))return{ok:true,note:'Lautschrift erkannt – auf '+LANG.name+': '+g}}
  return{ok:false};
}
function speechScore(alts,it){
  const g=target(it);const hasArt=!UBY[it.unit].alpha&&LANG.ART.test(g+' ');
  const cands=[strip(g)];if(hasArt)cands.push(strip(LANG.artless(g)));
  let best=0;
  alts.forEach(t=>{const h=strip(t);cands.forEach(c=>{const m=Math.max(h.length,c.length)||1;best=Math.max(best,1-lev(h,c)/m)})});
  return best;
}

let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function typeFor(it,box){
  const alpha=UBY[it.unit].alpha;
  let pool;
  if(box<=0)pool=['mc-gr-de','mc-de-gr'];
  else if(box===1)pool=['mc-de-gr','listen','speak'];
  else if(box===2)pool=alpha?['listen','mc-de-gr']:['listen','type'];
  else if(box===3)pool=alpha?['listen','speak']:['type','speak','listen'];
  else pool=alpha?['speak','listen']:['speak','type','listen'];
  if(!SR||!S.settings.speak)pool=pool.filter(t=>t!=='speak');
  if(it.gr.length>16||it.gr.includes('…'))pool=pool.filter(t=>t==='mc-gr-de'||t==='mc-de-gr'||t==='speak');
  if(!pool.length)pool=['mc-gr-de'];
  return pool[Math.floor(Math.random()*pool.length)];
}
let Q=[],cur=null,sess=null,view=!USER?'login':(LANGID?'home':'choose'),viewArg=null;
function startSession(unitId){
  const now=Date.now();
  const pool=ALL.filter(i=>!unitId||i.unit===unitId);
  let due=shuffle(pool.filter(i=>S.items[i.id]&&S.items[i.id].due<=now)).slice(0,S.settings.sessionLen);
  if(!unitId&&due.length<S.settings.sessionLen){const extra=shuffle(hardItems().filter(i=>!due.includes(i))).slice(0,Math.min(4,S.settings.sessionLen-due.length));due=due.concat(extra)}
  let fresh=unitId?pool.filter(i=>!S.items[i.id]).slice(0,S.settings.newPer):[];
  /* Neue Wörter kommen über den Lernpfad; die tägliche Runde wiederholt Gelerntes */
  if(!unitId&&!due.length)fresh=fresh.slice(0,S.settings.newPer);
  Q=due.map(i=>({it:i,type:typeFor(i,S.items[i.id].box),first:true}));
  for(let k=0;k<fresh.length;k+=2){
    const g=fresh.slice(k,k+2);
    g.forEach(i=>Q.push({it:i,type:'intro',first:false}));
    g.forEach(i=>Q.push({it:i,type:'mc-gr-de',first:true}));
  }
  if(!Q.length){
    const r=shuffle(pool.filter(i=>S.items[i.id])).slice(0,10);
    if(!r.length){toast('Hier gibt es noch nichts zu üben.');return}
    Q=r.map(i=>({it:i,type:typeFor(i,S.items[i.id].box),first:true}));
    toast('Nichts fällig – freie Übungsrunde.');
  }
  sess={n:0,ok:0,xp0:S.xp,total:Q.length};
  view='session';render();nextQ();
}
function startPron(unitId){
  const pool=ALL.filter(i=>!unitId||i.unit===unitId);
  const learned=pool.filter(i=>S.items[i.id]);
  const src=unitId?pool:(learned.length>=5?learned:pool);
  Q=shuffle(src).slice(0,10).map(i=>({it:i,type:'speak',first:false,pron:true}));
  sess={n:0,ok:0,xp0:S.xp,total:Q.length};
  view='session';render();nextQ();
}
function nextQ(){if(!Q.length)return endSession();cur=Q.shift();cur.tries=0;cur.answered=false;renderQ()}
function endSession(){cur=null;checkBadges();view='summary';render()}
function score(ok){
  const it=cur.it;
  const st=S.items[it.id]||(S.items[it.id]={box:0,due:0,seen:0,ok:0,bad:0});
  touchDay();
  const h=S.hist[today()]||(S.hist[today()]={n:0,ok:0});h.n++;if(ok)h.ok++;tick(h);
  if(cur.first){
    st.seen++;
    if(ok){st.ok++;st.box=Math.min(6,st.box+1);st.due=Date.now()+INTERVALS[st.box]*DAY;addXP(10)}
    else{st.bad++;st.box=Math.max(0,st.box-2);st.due=Date.now()}
  }else if(ok)addXP(3);
  sess.n++;if(ok)sess.ok++;sess.combo=ok?(sess.combo||0)+1:0;S.bestCombo=Math.max(S.bestCombo||0,sess.combo);
  if(!ok&&!cur.pron){Q.splice(Math.min(3,Q.length),0,{it,type:'mc-gr-de',first:false});sess.total++}
  save();
}

const GEM={models:['gemini-2.5-flash-preview-tts','gemini-2.5-flash-tts','gemini-2.5-pro-preview-tts'],voiceDe:'Kore',voiceTl:'Puck'};
async function gemModels(){
  const key=gemKey();const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}});
  if(!r.ok){let t='';try{t=(await r.json()).error.message}catch(e){}throw new Error('Modellliste HTTP '+r.status+(t?': '+t:''))}
  const j=await r.json();const all=(j.models||[]).map(m=>(m.name||'').replace(/^models\//,''));
  const tts=all.filter(n=>/tts/i.test(n)).sort((a,b)=>(/flash/.test(b)?1:0)-(/flash/.test(a)?1:0)||(/preview/.test(a)?1:0)-(/preview/.test(b)?1:0));

}

      const j=await r.json();const cand=(j.candidates||[])[0]||{};const parts=(cand.content||{}).parts||[];const p=parts.find(x=>x.inlineData&&/audio/i.test(x.inlineData.mimeType||''));

function podPlayPcm(pcm,rate){try{const a=new Audio(URL.createObjectURL(new Blob([pcmToWav(pcm,rate)],{type:'audio/wav'})));a.play()}catch(e){}}
function pcmToWav(pcm,rate){const n=pcm.length,b=new ArrayBuffer(44+n*2),d=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,rate,true);d.setUint32(28,rate*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);new Int16Array(b,44).set(pcm);return b}
function splitSilence(pcm,rate,expect){
  const fr=Math.round(rate*0.02),nf=Math.floor(pcm.length/fr),e=new Float32Array(nf);let peak=0;
  for(let f=0;f<nf;f++){let s=0;for(let i=f*fr;i<(f+1)*fr;i++){const v=pcm[i]/32768;s+=v*v}e[f]=Math.sqrt(s/fr);if(e[f]>peak)peak=e[f]}
  const tryTh=th=>{const segs=[];let inS=false,st=0,gap=0;const minGap=Math.round(0.28/0.02);
    for(let f=0;f<nf;f++){const loud=e[f]>th;if(loud){if(!inS){inS=true;st=f}gap=0}else if(inS){gap++;if(gap>=minGap){segs.push([st,f-gap]);inS=false;gap=0}}}
    if(inS)segs.push([st,nf]);return segs.filter(s=>s[1]-s[0]>=5)};

function podGenPaint(){const el=document.getElementById('podgen');if(el)el.innerHTML=POD.gen?`<div class="meta">${esc(POD.gen)}</div><div class="podbar"><i style="width:${POD.genPct||0}%"></i></div>`:`<div class="actions" style="justify-content:flex-start"><button class="primary" onclick="podExport()">🎙️ Datei erzeugen</button><button onclick="podTestKey()">Verbindung testen</button></div>`}

const CTTS={voices:{}};

const xmlEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function cttsVoice(code){
  if(CTTS.voices[code])return CTTS.voices[code];
  const r=await fetch('https://texttospeech.googleapis.com/v1/voices?languageCode='+code,{headers:{'x-goog-api-key':gemKey()}});
  if(!r.ok){let t='';try{t=(await r.json()).error.message}catch(e){}throw new Error('Stimmenliste HTTP '+r.status+(t?': '+t:''))}
  const vs=((await r.json()).voices||[]).filter(v=>!/chirp|journey|studio|polyglot/i.test(v.name)&&((v.languageCodes||[]).some(c=>c.toLowerCase()===code.toLowerCase())||v.name.toLowerCase().startsWith(code.toLowerCase())));
  const rank=v=>(/neural2/i.test(v.name)?3:/wavenet/i.test(v.name)?2:/standard/i.test(v.name)?1:0)*10+(v.ssmlGender==='FEMALE'?1:0);
  vs.sort((a,b)=>rank(b)-rank(a));if(!vs.length)throw new Error('Keine Stimme für '+code);
  CTTS.voices[code]=vs[0].name;return vs[0].name;
}

/* ---------- Diktat über das Tastatur-Mikrofon ---------- */
function showDict(){const d=$('#dict');if(!d)return;d.hidden=false;const a=$('#ans');if(a)setTimeout(()=>{try{a.focus()}catch(e){}},50)}
function submitDict(){
  if(cur.answered)return;
  const v=$('#ans').value.trim();
  if(!v){toast('Bitte erst sprechen oder etwas eingeben.');return}
  const sc=speechScore([v],cur.it);
  $('#heard').innerHTML='Verstanden: <b>'+esc(v)+'</b> ('+Math.round(sc*100)+'%)';
  if(sc>=.72){cur.answered=true;$('#ans').disabled=true;feedback(true)}
  else{cur.tries++;$('#recmsg').textContent='Noch nicht ganz – versuch es nochmal.';$('#ans').value=''}
}

/* ---------- Spracheingabe ---------- */
let rec=null;
function startRec(){
  if(!SR){toast('Spracheingabe wird hier nicht unterstützt (bitte Chrome oder Edge nutzen).');return}
  if(cur.answered)return;
  if(rec){try{rec.abort()}catch(e){}}
  if(TTS)speechSynthesis.cancel();
  rec=new SR();rec.lang=LANG.tts;rec.interimResults=false;rec.maxAlternatives=5;
  const mic=$('#mic'),msg=$('#recmsg');
  mic.classList.add('rec');msg.textContent='Ich höre zu …';
  let got=false;
  rec.onresult=e=>{
    got=true;
    const alts=[...e.results[0]].map(a=>a.transcript);
    const sc=speechScore(alts,cur.it);
    $('#heard').innerHTML='Verstanden: <b>'+esc(alts[0])+'</b> ('+Math.round(sc*100)+'%)';
    if(sc>=.72){cur.answered=true;mic.disabled=true;feedback(true)}
    else{cur.tries++;msg.textContent=cur.tries>=2?'Noch nicht ganz. Du kannst es nochmal versuchen oder aufgeben.':'Fast – versuch es nochmal, sprich deutlich.'}
  };
  rec.onerror=e=>{
    const m={'not-allowed':'Mikrofon-Zugriff wurde blockiert. Erlaube ihn in der Adressleiste.','service-not-allowed':'Mikrofon-Zugriff wurde blockiert.','no-speech':'Nichts gehört – tippe nochmal aufs Mikrofon.','network':'Spracherkennung braucht eine Internetverbindung.','audio-capture':'Kein Mikrofon gefunden.'};
    msg.textContent=m[e.error]||('Fehler: '+e.error);
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){msg.textContent='Das Browser-Mikrofon ist auf dieser Seite gesperrt. Nutze stattdessen das Tastatur-Mikrofon unten.';showDict()}
  };
  rec.onend=()=>{mic.classList.remove('rec');if(!got&&msg.textContent==='Ich höre zu …')msg.textContent='Nichts gehört – tippe nochmal aufs Mikrofon.'};
  try{rec.start()}catch(e){msg.textContent='Konnte das Mikrofon nicht starten.'}
}

    q.dn.push(i);q.sel=null;q.bad=null;beep(true);

function lfeedback(ok,note){

/* ---------- Automatische Lautschrift (Deutsch-freundlich) ---------- */
const TLX={'πέμπτη':'pémpti','γεια':'ya','συγγνώμη':'signómi','συγνώμη':'signómi','αντίο':'andío','μπαμπάς':'babás'};
function trCore(w){
  const BASE={'ά':'α','έ':'ε','ή':'η','ί':'ι','ό':'ο','ύ':'υ','ώ':'ω','ΐ':'ι','ϊ':'ι','ΰ':'υ','ϋ':'υ'};
  const ST='άέήίόύώΐΰ',DI='ϊϋΐΰ';
  const AV={'α':'a','ε':'e','η':'i','ι':'i','ο':'o','υ':'i','ω':'o'};
  const ACC={a:'á',e:'é',i:'í',o:'ó',u:'ú'};
  const VOW='αεηιουω',VL='κξπστφχψθ';
  const c=[...w].map(ch=>({b:BASE[ch]||ch,s:ST.includes(ch),d:DI.includes(ch)}));
  const acc=(s,t)=>s?ACC[t.charAt(0)]+t.slice(1):t;
  let out='';
  for(let i=0;i<c.length;i++){
    const x=c[i],n=c[i+1],b=x.b,nb=n?n.b:'';
    if(VOW.includes(b)){
      if(n&&!n.d&&!x.d){
        const pr=b+nb,st=x.s||n.s;
        const split=x.s&&!n.s;  /* Betonung auf dem ersten Vokal: kein Doppellaut (τσάι = tsái) */
        if(pr==='αι'&&!split){out+=acc(st,'e');i++;continue}
        if((pr==='ει'||pr==='οι'||pr==='υι')&&!split){out+=acc(st,'i');i++;continue}
        if(pr==='ου'){out+=acc(st,'u');i++;continue}
        if(pr==='αυ'||pr==='ευ'){
          const nx=c[i+2];const vl=!nx||VL.includes(nx.b);
          out+=acc(st,pr==='αυ'?'a':'e')+(vl?'f':'v');i++;continue}
      }
      out+=acc(x.s,AV[b]);continue;
    }
    const first=i===0;
    switch(b){
      case 'β':if(nb==='β')i++;out+='v';break;
      case 'γ':{
        if(nb==='γ'){out+='ng';i++;break}
        if(nb==='κ'){out+=first?'g':'ng';i++;break}
        if(nb==='ξ'){out+='nks';i++;break}
        if(nb==='χ'){out+='nch';i++;break}
        const nn=c[i+2],nnb=nn?nn.b:'';
        const front=n&&('εηιυ'.includes(nb)||((nb==='α'||nb==='ο')&&nnb==='ι'));
        out+=front?'y':'g';
        if(n&&nb==='ι'&&nn&&VOW.includes(nnb)&&!n.s){i++}
        break}
      case 'δ':out+='d';break;
      case 'ζ':out+='z';break;
      case 'θ':out+='th';break;
      case 'κ':if(nb==='κ')i++;out+='k';break;
      case 'λ':if(nb==='λ')i++;out+='l';break;
      case 'μ':if(nb==='π'){out+=first?'b':'mb';i++;break}if(nb==='μ')i++;out+='m';break;
      case 'ν':if(nb==='τ'){out+=first?'d':'nd';i++;break}if(nb==='ν')i++;out+='n';break;
      case 'ξ':out+='ks';break;
      case 'π':if(nb==='π')i++;out+='p';break;
      case 'ρ':if(nb==='ρ')i++;out+='r';break;
      case 'σ':case 'ς':if(nb==='σ')i++;out+='s';break;
      case 'τ':if(nb==='σ'){out+='ts';i++;break}if(nb==='ζ'){out+='dz';i++;break}if(nb==='τ')i++;out+='t';break;
      case 'φ':out+='f';break;
      case 'χ':out+='ch';break;
      case 'ψ':out+='ps';break;
      default:out+=b;
    }
  }
  return out;
}

function qRead(w,sc){return{t:'mc',lab:'Wie liest man das Wort?',q:w.gr,opts:shuffle([w.tr].concat(dist(w,'tr',sc))),a:w.tr,hear:false,say:w.say,full:w.gr+' = '+w.tr+' ('+w.de+')'}}
const typeOK=w=>!w.gr.includes('…')&&w.gr.length<=16&&w.gr.split(' ').length<=2;
function qType(w){

function qHearType(w){const q=qType(w);q.lab='Hör zu und schreibe das Wort';q.q='🎧';q.hear=true;q.auto=true;q.hint=w.de;return q}
function qLine(d,sc,hear){
  const own=sc||[];
  const pool=shuffle(own).concat(shuffle(NODES.filter(n=>n.D).flatMap(n=>n.D)));
  const seen=new Set([d.de]),opts=[d.de];

             :{t:'mc',lab:'Was bedeutet der Satz?',q:d.gr,sub:d.idx<=8&&S.settings.translit?d.tr:'',opts:shuffle(opts),a:d.de,hear:true,say:d.say,full:d.gr+' = '+d.de};
}
const nTok=s=>s.split(' ').length;
function qArr(s){return{t:'arr',a:s.gr,sub:s.de,say:s.say,full:s.gr}}
function qMatch(ws,n){
  const used=new Set(),pairs=[];
  shuffle(ws).forEach(w=>{if(pairs.length<n&&w.gr.length<=26&&w.de.length<=30&&!used.has(w.de)&&!used.has(w.gr)){used.add(w.de);used.add(w.gr);pairs.push([w.gr,w.de])}});
  return{t:'match',pairs:pairs};
}
function qLetterName(x,L){

}
function qLetterSound(x,L){

  const od=shuffle(L.filter(y=>y!==x&&tok(y)!==tok(x))).slice(0,3).map(y=>y[3]);
  if(od.length<2)return null;
  return{t:'mc',lab:'Wie klingt dieser Buchstabe?',q:x[0],opts:shuffle([x[3]].concat(od)),a:x[3],say:x[1],full:x[0]+' = '+x[3]}

/* ---------- Übungen je Lektion ---------- */
function reviewWords(l){
  const prev=NODES.filter(n=>n.W&&n.idx<l.idx);
  const recent=prev.slice(-3).flatMap(n=>n.W);
  return recent.length?recent:[];
}
function genLesson(l){
  const W=l.W,qs=[];
  qs.push(qMatch(W,5));
  shuffle(W).slice(0,4).forEach(w=>qs.push(qGD(w)));
  shuffle(W).slice(0,3).forEach(w=>qs.push(qLis(w)));
  shuffle(W).slice(0,3).forEach(w=>qs.push(qDG(w)));
  shuffle(W.filter(typeOK)).slice(0,2).forEach(w=>qs.push(qType(w)));
  qGaps(l,2).forEach(q=>qs.push(q));
  shuffle(l.D).slice(0,2).forEach(d=>qs.push(qLine(d,l.D,true)));
  shuffle(l.D).slice(0,1).forEach(d=>qs.push(qLine(d,l.D,false)));
  shuffle(l.D.concat(l.S).filter(s=>nTok(s.gr)>=3&&nTok(s.gr)<=8)).slice(0,3).forEach(s=>qs.push(qArr(s)));
  shuffle(reviewWords(l)).slice(0,3).forEach(w=>qs.push(Math.random()<.5?qGD(w,reviewWords(l)):qDG(w,reviewWords(l))));
  if(W.length>=8)qs.push(qMatch(shuffle(W),5));
  if(W.length>16){qs.push(qMatch(shuffle(W),5));shuffle(W).slice(0,3).forEach(w=>qs.push(qLis(w)));shuffle(W.filter(typeOK)).slice(0,1).forEach(w=>qs.push(qType(w)))}
  return qs;
}
function genAlpha(l){
  const W=l.W,L=l.letters,qs=[];
  const names=l.nameQ!==false;
  if(L&&L.length){
    if(names)qs.push(qLetterMatch(L,5));
    if(names)shuffle(L).slice(0,3).forEach(x=>qs.push(qLetterName(x,L)));
    shuffle(L).slice(0,names?2:4).forEach(x=>qs.push(qLetterHear(x,L)));
    shuffle(L).slice(0,names?3:5).forEach(x=>{const q=qLetterSound(x,L);if(q)qs.push(q)});
  }
  if(LANG.hasTr)shuffle(W).slice(0,5).forEach(w=>qs.push(qRead(w)));
  else{shuffle(W).slice(0,3).forEach(w=>qs.push(qGD(w)));shuffle(W).slice(0,2).forEach(w=>qs.push(qLis(w)))}
  shuffle(W).slice(0,3).forEach(w=>qs.push(qLisGr(w)));
  shuffle(W).slice(0,3).forEach(w=>qs.push(qGD(w)));
  shuffle(W.filter(typeOK)).slice(0,2).forEach(w=>qs.push(qHearType(w)));
  shuffle(W).slice(0,2).forEach(w=>qs.push(qDG(w)));
  const rv=reviewWords(l);
  if(LANG.hasTr)shuffle(rv).slice(0,3).forEach(w=>qs.push(qRead(w,rv)));
  else shuffle(rv).slice(0,3).forEach(w=>qs.push(qGD(w,rv)));
  return qs;
}
function genTest(t){
  const ls=t.final?NODES.filter(n=>n.W):NODES.filter(n=>n.blk===t.blk&&n.W);
  const W=ls.flatMap(n=>n.W),D=ls.flatMap(n=>n.D),S_=ls.flatMap(n=>n.S);
  const counts=t.final?{gd:7,lis:4,dg:6,ty:4,ln:4,ar:4,rd:0}:{gd:5,lis:3,dg:4,ty:3,ln:3,ar:3,rd:0};
  const qs=[];
  const alphaBlk=ls.some(n=>n.type==='alpha');
  if(alphaBlk){
    const LT=ls.flatMap(n=>n.letters||[]);
    const names=ls.every(n=>n.nameQ!==false);
    if(names)shuffle(LT).slice(0,4).forEach(x=>qs.push(qLetterName(x,LT)));
    else shuffle(LT).slice(0,4).forEach(x=>{const q=qLetterSound(x,LT);if(q)qs.push(q)});
    shuffle(LT).slice(0,2).forEach(x=>qs.push(qLetterHear(x,LT)));
    if(LANG.hasTr)shuffle(W).slice(0,5).forEach(w=>qs.push(qRead(w,W)));
    else{shuffle(W).slice(0,3).forEach(w=>qs.push(qDG(w,W)));shuffle(W).slice(0,2).forEach(w=>qs.push(qLis(w,W)))}
    shuffle(W).slice(0,3).forEach(w=>qs.push(qLisGr(w,W)));
    shuffle(W.filter(typeOK)).slice(0,2).forEach(w=>qs.push(qHearType(w)));
    shuffle(W).slice(0,3).forEach(w=>qs.push(qGD(w,W)));
    return shuffle(qs);
  }
  shuffle(W).slice(0,counts.gd).forEach(w=>qs.push(qGD(w,W)));
  shuffle(W).slice(0,counts.lis).forEach(w=>qs.push(qLis(w,W)));
  shuffle(W).slice(0,counts.dg).forEach(w=>qs.push(qDG(w,W)));
  shuffle(W.filter(typeOK)).slice(0,counts.ty).forEach(w=>qs.push(qType(w)));
  shuffle(D).slice(0,counts.ln).forEach((d,i)=>qs.push(qLine(d,D,i%2===0)));
  shuffle(D.concat(S_).filter(s=>nTok(s.gr)>=3&&nTok(s.gr)<=8)).slice(0,counts.ar).forEach(s=>qs.push(qArr(s)));
  qs.push(qMatch(W,5));
  if(!t.final){
    const earlier=NODES.filter(n=>n.W&&n.blk<t.blk&&n.type!=='alpha').flatMap(n=>n.W);
    shuffle(earlier).slice(0,2).forEach(w=>qs.push(qGD(w,earlier)));
  }
  return shuffle(qs);
}

function pathFinish(r){
  const n=NODEBY[r.path],acc=r.firstOk/Math.max(1,r.total0),pct=Math.round(acc*100);
  const stars=acc>=.9?3:acc>=.7?2:1;

  let passed=true,title,icon,lines,xp;

    S.path[n.id]=Object.assign(old,{plays:old.plays+1,best:Math.max(old.best||0,pct),stars:passed?Math.max(old.stars,stars):old.stars,done:old.done||passed});
    title=passed?'Check bestanden!':'Noch nicht ganz …';
    icon=passed?'🏁':'💪';
    lines=[r.firstOk+' von '+r.total0+' richtig ('+pct+' %)',passed?(n.final?'Du hast Niveau A1 geschafft. Glückwunsch!':'Der nächste Block ist freigeschaltet.'):'Du brauchst 70 %. Schau dir die Lektionen nochmal an und versuch es gleich noch einmal.'];
    xp=passed?(n.final?100:40):5;
  }else{
    S.path[n.id]=Object.assign(old,{plays:old.plays+1,stars:Math.max(old.stars,stars),best:Math.max(old.best||0,pct),done:true});
    registerWords(n);
    title='Lektion geschafft!';icon='⭐'.repeat(stars)+'☆'.repeat(3-stars);
    lines=[r.firstOk+' von '+r.total0+' gleich beim ersten Versuch richtig','Die Wörter kommen jetzt in deine tägliche Wiederholung.'];
    GRAM.filter(g=>g.after===n.id).forEach(g=>lines.push('📘 Neu freigeschaltet: Grammatik „'+g.title+'“'));
    xp=20+(stars===3?10:0);
  }
  save();
  const nx=NODES[NODES.indexOf(n)+1];
  gameDone({xp0:r.xp0,title:title,icon:icon,lines:lines,xp:xp,again:r.again,back:'path',next:passed&&nx?nx.id:null,confetti:passed});
}
function skipTest(id){if(!confirm('Diesen Check überspringen? Du kannst ihn später jederzeit wiederholen.'))return;S.path[id]=Object.assign(S.path[id]||{plays:0,stars:0,best:0},{done:true,skipped:true});save();render()}

/* ---------- Ansichten ---------- */
function nodeCard(n){
  const i=NODES.indexOf(n),st=nodeState(i),r=S.path[n.id]||{},isCur=i===curNodeIdx();
  const stars=r.done&&!r.skipped?[1,2,3].map(k=>r.stars>=k?'⭐':'☆').join(''):'';
  const left=st==='lock'?'🔒':st==='done'?'✅':n.icon;
  let btn;
  if(st==='lock')btn=`<button disabled>Gesperrt</button>`;
  else if(st==='done')btn=`<button onclick="startNode('${n.id}')">Wiederholen</button>`;
  else btn=`<button class="primary" onclick="startNode('${n.id}')">${isCur?'Weiter':'Start'}</button>`;
  let extra='';
  if(n.type==='test'&&!r.done&&r.plays>=3&&st!=='lock')extra=`<button class="ghost" onclick="skipTest('${n.id}')">Überspringen</button>`;
  if(n.W&&st==='done')extra=`<button class="ghost" onclick="go('list','${n.id}')">Wörter</button>`;
  if(n.D&&n.D.length>=3&&new Set(n.D.map(d=>d.sp)).size>=2&&st==='done')extra+=`<button class="ghost" onclick="go('role','${n.id}')" title="Rollenspiel${S.hi['role_'+n.id]?' · bisher '+S.hi['role_'+n.id]+' %':''}">💬</button>`;
  if(n.D&&n.D.length>=3&&st==='done')extra+=`<button class="ghost" onclick="startHear('${n.id}')" title="Hörverstehen${S.hi['hear_'+n.id]?' · bisher '+S.hi['hear_'+n.id]+' %':''}">🎧${S.hi['hear_'+n.id]?' '+S.hi['hear_'+n.id]+' %':''}</button>`;
  const gr=n.W&&st==='done'?GRAM.filter(g=>g.after===n.id):[];
  gr.forEach(g=>{extra+=`<button class="ghost" onclick="startLesson('${g.id}')" title="${esc(g.title)}">📘 Grammatik</button>`});
  const sub=n.type==='test'?(r.plays?'Bester Versuch: '+r.best+' %':'Mindestens 70 % nötig'):esc(n.goal||'');
  return `<div class="node ${st} ${isCur&&st!=='lock'?'cur':''}"><div class="nico">${left}</div><div class="ntx"><b>${esc(n.title)}</b><div class="meta" style="margin:2px 0 0">${sub}</div>${stars?`<div class="stars">${stars}</div>`:''}</div><div class="nbt">${btn}${extra}</div></div>`;
}
function pathHTML(){
  const total=NODES.length,done=pCount(false);
  let h=topbar()+`<h2 style="margin:4px 0">Lernpfad Niveau A1</h2><p class="meta" style="margin:0 0 8px">${done} von ${total} Stationen geschafft. Gehe der Reihe nach vor, nach jedem Block wartet ein Check.</p><div class="bar gold" style="margin-bottom:14px"><i style="width:${done/total*100}%"></i></div>`;
  PATH_BLOCKS.forEach(b=>{
    const ns=NODES.filter(n=>n.blk===b.id);if(!ns.length)return;
    const d=ns.filter(n=>pDone(n.id)).length;
    h+=`<div class="blk"><div class="blkhd"><span class="ico">${b.icon}</span><div style="flex:1"><h3>${esc(b.title)}</h3><div class="meta" style="margin:0">${esc(b.desc)}</div></div><span class="meta">${d}/${ns.length}</span></div>${ns.map(nodeCard).join('')}</div>`;
  });
  return h;
}
function continueCardHTML(){
  const n=NODES[curNodeIdx()],all=pCount(false)>=NODES.length;
  const done=pCount(false);
  return `<div class="daily" style="background:linear-gradient(135deg,#17824b,#27b36f)"><div style="flex:1"><h2>${all?'Lernpfad A1 geschafft! 🎉':'Weiter im Lernpfad'}</h2><p>${all?'Wiederhole beliebige Lektionen oder spiele eine Runde.':esc(n.icon+' '+n.title)}</p><div class="bar" style="margin-top:8px;background:rgba(255,255,255,.3)"><i style="width:${done/NODES.length*100}%;background:#fff"></i></div></div><button onclick="${all?"go('path')":"startNode('"+n.id+"')"}">${all?'Ansehen':'Los'}</button></div>`;
}

const hearRow=()=>'<div class="audiorow"><button class="primary" onclick="lsay()">▶ Anhören</button><button onclick="lsay(true)">🐢 Langsam</button></div>';

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&view==='lesson'&&L&&L.cur&&L.cur.done&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();lnext()}});

render();
</script>
</body>
</html>
